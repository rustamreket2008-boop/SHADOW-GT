name: Build SHADOW GT APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
             
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Create Android debug keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("export_presets.cfg")
          text = path.read_text()

          values = {
              "keystore/debug": os.environ["RUNNER_TEMP"] + "/debug.keystore",
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          for key, value in values.items():
              pattern = rf'^{re.escape(key)}=.*$'
              replacement = f'{key}="{value}"'
              if re.search(pattern, text, flags=re.MULTILINE):
                  text = re.sub(
                      pattern, lambda _: replacement,
                      text, count=1, flags=re.MULTILINE
                  )
              else:
                  text += f"\n{replacement}\n"

          path.write_text(text)
          print("Android signing settings configured.")
          PY

      - name: Check project files
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn
          echo "Project files found."

      - name: Import project
        run: |
          godot --headless --editor --path . --quit
      
      - name: Diagnose Android export
        run: |
          echo "=== Export preset ==="
          cat export_presets.cfg
          echo "=== Android SDK ==="
          ls -la "$ANDROID_HOME"
          echo "=== Godot export templates ==="
          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          echo "=== Check export ==="
          godot --headless --editor --path . --quit --verbose
    
      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --verbose --export-debug "Android" build/SHADOW-GT.apk
          test -s build/SHADOW-GT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-GT-Android-APK
          path: build/SHADOW-GT.apk
          if-no-files-found: error
