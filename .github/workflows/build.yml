name: SHADOW GT Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f project.godot
          test -f scenes/Main.tscn
          test -f scenes/Car.tscn
          test -f export_presets.cfg

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SHADOW-GT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-GT-APK
          path: build/SHADOW-GT.apk
          if-no-files-found: error
          
